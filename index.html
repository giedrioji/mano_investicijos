<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Investment Portfolio</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
        }
        p {
            color: #94a3b8;
            margin: 0 0 25px 0;
            font-size: 0.95rem;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #334155;
            padding-top: 15px;
            margin-top: 25px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="total-value">Loading...</h1>
        <p>Current Portfolio Value (EUR)</p>
        
        <canvas id="portfolioChart"></canvas>

        <div class="stats">
            <div>Invested: <span id="total-invested" style="font-weight: bold;">-</span></div>
            <div>Profit/Loss: <span id="profit-loss" style="font-weight: bold;">-</span></div>
        </div>
    </div>

    <script>
        fetch('portfolio.json')
            .then(res => res.json())
            .then(data => {
                // 1. Skaičiuojame dabartinę kiekvienos pozicijos vertę
                const positions = data.positions.map(p => {
                    const currentVal = p.shares * (p.currentPrice || p.avgPrice);
                    const investedVal = p.shares * p.avgPrice;
                    return { 
                        ticker: p.ticker, 
                        value: currentVal, 
                        invested: investedVal,
                        category: p.category 
                    };
                });

                // 2. Skaičiuojame bendras sumas
                const currentTotal = positions.reduce((sum, p) => sum + p.value, 0);
                const investedTotal = data.meta.totalInvested || positions.reduce((sum, p) => sum + p.invested, 0);
                const profitLoss = currentTotal - investedTotal;
                const profitPercent = (profitLoss / investedTotal) * 100;

                // 3. Atvaizduojame skaičius puslapyje
                document.getElementById('total-value').innerText = currentTotal.toLocaleString('lt-LT', { style: 'currency', currency: 'EUR' });
                document.getElementById('total-invested').innerText = investedTotal.toLocaleString('lt-LT', { style: 'currency', currency: 'EUR' });
                
                const plElement = document.getElementById('profit-loss');
                const sign = profitLoss >= 0 ? '+' : '';
                plElement.innerText = `${sign}${profitLoss.toLocaleString('lt-LT', { style: 'currency', currency: 'EUR' })} (${sign}${profitPercent.toFixed(2)}%)`;
                plElement.style.color = profitLoss >= 0 ? '#10b981' : '#ef4444';

                // 4. Paruošiame duomenis grafikui
                const labels = positions.map(p => p.ticker);
                const values = positions.map(p => p.value);
                const colors = positions.map(p => data.categoryColors[p.category] || '#94a3b8');

                // 5. Braižome grafiką
                new Chart(document.getElementById('portfolioChart'), {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: values,
                            backgroundColor: colors,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: '#f8fafc', font: { family: 'sans-serif', size: 12 }, padding: 15 }
                            }
                        }
                    }
                });
            });
    </script>
</body>
</html>
